# Local development stack. Each service stands in for one production
# dependency, so the whole upload -> store -> transform -> deliver path can be
# exercised without any cloud account (docs/SETUP.md is the production path).
#
#   Supabase Postgres            -> postgres (same major, pgvector preinstalled)
#   Cloudflare R2                -> minio    (S3-compatible, same SigV4 presigning)
#   CF Image Transformations     -> imgproxy (on-the-fly resize from the bucket)
#   Resend                       -> mailpit  (catches outgoing mail, web UI)

name: g-gallery

services:
  postgres:
    # pgvector ships preinstalled so the semantic-search option in the plan
    # can be tried locally without rebuilding the image.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: g_gallery
      POSTGRES_PASSWORD: g_gallery
      POSTGRES_DB: g_gallery
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g_gallery -d g_gallery"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gallerydev
      MINIO_ROOT_PASSWORD: gallerydev
      # Browser PUTs to presigned URLs are cross-origin from localhost:3000.
      # Production R2 uses a locked-down CORS policy instead (docs/SETUP.md §3).
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the bucket and makes objects publicly readable, matching
  # the R2 custom-domain setup where the gallery loads images directly.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 gallerydev gallerydev &&
      mc mb --ignore-existing local/g-gallery &&
      mc anonymous set download local/g-gallery &&
      echo 'minio ready: bucket g-gallery is public-read'
      "

  imgproxy:
    image: darthsim/imgproxy:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # Unsigned URLs are fine locally; production uses Cloudflare, which needs
      # no signing because transformations are bound to the zone.
      IMGPROXY_ALLOW_ORIGIN: "*"
      IMGPROXY_BASE_URL: http://minio:9000/g-gallery/
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ENABLE_AVIF_DETECTION: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: "80"
    ports:
      - "8080:8080"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    environment:
      MP_MAX_MESSAGES: "500"

volumes:
  postgres-data:
  minio-data:
