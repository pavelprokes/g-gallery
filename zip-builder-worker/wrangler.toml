name = "g-gallery-zip-builder"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Deliberately NO [limits] override (docs/TODO.md §7). CPU was never the
# binding constraint here — **memory** is: 128 MB per isolate, on every plan,
# shared by however many consumer invocations Cloudflare decides to run at
# once. The consumer settings below are what keeps this Worker inside it.

[vars]
APP_CALLBACK_URL = "https://photos.svatebni-fotograf-cechy.cz/api/internal/zip-callback"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "g-gallery"
# Without this, wrangler provisions/binds the DEFAULT-jurisdiction bucket —
# a same-named but entirely different resource from the real one (created
# jurisdiction=eu, docs/SETUP.md §3, immutable at creation). Learned the hard
# way: the first deploy of this Worker silently created a second, empty
# "g-gallery" bucket outside the EU jurisdiction.
jurisdiction = "eu"

[[queues.producers]]
binding = "PARTS"
queue = "g-gallery-zip-parts"

[[queues.consumers]]
queue = "g-gallery-zip-parts"
# ONE part per invocation, and a hard cap on how many invocations run at once.
#
# This is the fix for the 2026-09-01 outage: a 377-photo gallery enqueues 315
# part messages at once, and with `max_batch_size = 10` and auto-scaled
# concurrency, Cloudflare ran many invocations in one 128 MB isolate, each
# churning through ten parts that cost 12 MB live apiece (the old assembly
# buffered every part twice). 718 of 1013 invocations came back
# `exceededResources` — while using *less* CPU than the ones that succeeded,
# which is what proves it was memory. Parts were retried, killed again, and
# dropped after `max_retries`; only 111 of 315 ever landed, so the build could
# never finish and the gallery sat on "Připravujeme archiv" for a day.
#
# Peak now: max_concurrency x (one 6 MiB part buffer + one stream chunk) =
# 4 x 6.1 MB = ~25 MB against a 128 MB ceiling. Do not raise either number without redoing
# that arithmetic — nothing else in this Worker enforces it.
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 4
# A part that fails four times is a real bug, not congestion. It goes to the
# dead-letter queue instead of vanishing: the build it belongs to is doomed
# either way, but a message sitting in a queue is something you can look at.
max_retries = 3
dead_letter_queue = "g-gallery-zip-parts-dlq"

[triggers]
# Checks for finished builds (finalize) and stale ones (abort). Workers Free
# allows up to 5 Cron Triggers per account — this uses one.
crons = ["*/2 * * * *"]

[observability]
enabled = true
